<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#FBF7EE">
<title>Page introuvable — Aventures Colomb</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<style>
  :root{--navy:#0E3B50;--teal:#2C7A8C;--orange:#F2884B;--cream:#FBF7EE;--line:rgba(14,59,80,.14)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--cream);color:var(--navy);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.55;text-align:center}
  main{max-width:520px}
  img{width:140px;height:140px;margin:0 auto 18px;display:block}
  .code{font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--orange);background:rgba(242,136,75,.12);display:inline-block;padding:6px 14px;border-radius:999px;margin-bottom:14px}
  h1{font-size:clamp(26px,6vw,36px);line-height:1.2;margin-bottom:12px}
  p{color:#3d5a68;margin-bottom:26px}
  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:12px 22px;border-radius:11px;font-weight:600;font-size:15px;text-decoration:none}
  a.primary{background:var(--orange);color:#fff;box-shadow:0 6px 16px rgba(242,136,75,.35)}
  a.outline{border:1.5px solid var(--navy);color:var(--navy)}
  a.btn:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
</style>
</head>
<body>
<main>
  <img src="/assets/logo-160.png" alt="Aventures Colomb" width="140" height="140">
  <span class="code">Erreur 404</span>
  <h1>Oups, cette route n'existe pas</h1>
  <p>La page que vous cherchez a peut-être été déplacée ou n'existe plus. Retournez à l'accueil pour découvrir nos sorties et excursions d'entreprise, ou consultez la billetterie.</p>
  <div class="actions">
    <a class="btn primary" href="/">Retour à l'accueil</a>
    <a class="btn outline" href="/?page=billetterie">Voir la billetterie</a>
  </div>
</main>
</body>
</html>
