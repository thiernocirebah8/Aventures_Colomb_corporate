<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aventures Colomb — Espace Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c2321; --cream:#f6f1e4; --paper:#fffdf8;
    --forest:#2f5d45; --clay:#b5442e; --gold:#dda13a;
    --line:rgba(28,35,33,.12); --ok:#2f5d45; --err:#b5442e;
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--ink);color:var(--ink);font-family:'Inter',sans-serif;display:flex;flex-direction:column;}
  h1,h2{font-family:'Fraunces',serif;margin:0;}
  .mono{font-family:'Space Mono',monospace;}

  /* CONFIG: mets ici l'URL de ton déploiement Apps Script */
  /* const API_URL défini dans le script plus bas */

  .topbar{background:var(--ink);color:var(--paper);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;}
  .topbar .who{font-size:13px;color:#c8c2b4;}
  .topbar button{background:none;border:1px solid rgba(255,255,255,.25);color:var(--paper);padding:7px 12px;border-radius:8px;font-size:12px;cursor:pointer;}

  .screen{flex:1;background:var(--cream);border-radius:22px 22px 0 0;padding:26px 20px 40px;display:flex;flex-direction:column;}

  /* LOGIN */
  #login-screen{justify-content:center;align-items:center;text-align:center;background:var(--ink);border-radius:0;padding:40px 24px;}
  #login-screen .mark{width:52px;height:52px;border-radius:50%;background:var(--gold);color:var(--ink);font-family:'Fraunces',serif;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:20px;}
  #login-screen h1{color:var(--paper);font-size:22px;}
  #login-screen p{color:#a9b0a3;font-size:13px;margin-top:6px;}
  .field{width:100%;max-width:320px;margin-top:16px;text-align:left;}
  .field label{font-size:12px;color:#c8c2b4;display:block;margin-bottom:6px;}
  .field input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:#2a332f;color:var(--paper);font-size:15px;}
  .field input:focus{outline:2px solid var(--gold);}
  .btn-primary{width:100%;max-width:320px;margin-top:20px;padding:15px;border:none;border-radius:12px;background:var(--clay);color:#fff;font-size:15px;font-weight:600;cursor:pointer;}
  .btn-primary:disabled{background:#5d5449;cursor:not-allowed;}
  .error-msg{max-width:320px;margin-top:14px;background:rgba(181,68,46,.15);border:1px solid rgba(181,68,46,.4);color:#e8a58f;padding:10px 14px;border-radius:10px;font-size:13px;}

  /* VALIDATION */
  #validate-screen{display:none;}
  .code-input-row{display:flex;gap:8px;}
  .code-input-row input{flex:1;padding:16px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-family:'Space Mono',monospace;font-size:20px;letter-spacing:3px;text-transform:uppercase;text-align:center;}
  .code-input-row input:focus{outline:2px solid var(--forest);}
  .btn-check{padding:0 20px;border:none;border-radius:12px;background:var(--ink);color:var(--paper);font-weight:600;cursor:pointer;}

  .result-card{margin-top:18px;background:var(--paper);border-radius:16px;border:1px solid var(--line);padding:18px;display:none;}
  .result-card.ok{border-color:var(--ok);}
  .result-card.err{border-color:var(--err);}
  .result-card .status{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
  .result-card.ok .status{color:var(--ok);}
  .result-card.err .status{color:var(--err);}
  .result-card h2{font-size:19px;margin-top:6px;}
  .result-row{display:flex;justify-content:space-between;font-size:14px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);color:#40453f;}
  .result-row b{color:var(--ink);}

  .confirm-block{margin-top:16px;}
  .confirm-block label{font-size:12.5px;color:#5a5f57;display:block;margin-bottom:6px;}
  .confirm-row{display:flex;gap:8px;}
  .confirm-row input{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);font-family:'Space Mono',monospace;text-align:center;letter-spacing:2px;}
  .btn-validate{padding:0 18px;border:none;border-radius:10px;background:var(--forest);color:#fff;font-weight:600;cursor:pointer;}
  .btn-validate:disabled{background:#a9b0a3;cursor:not-allowed;}

  .hint{font-size:11.5px;color:#8a8f86;margin-top:14px;text-align:center;}
</style>
</head>
<body>

<div id="login-screen">
  <div class="mark">AC</div>
  <h1>Espace Agent</h1>
  <p>Aventures Colomb — contrôle d'accès</p>
  <div class="field">
    <label>Identifiant agent</label>
    <input id="agentId" type="text" placeholder="ex : goree01" autocapitalize="none">
  </div>
  <div class="field">
    <label>Mot de passe</label>
    <input id="password" type="password" placeholder="••••••••">
  </div>
  <button class="btn-primary" id="loginBtn" onclick="doLogin()">Se connecter</button>
  <div class="error-msg" id="loginError" style="display:none;"></div>
</div>

<div id="app-container" style="display:none;flex:1;display:none;flex-direction:column;">
  <div class="topbar">
    <div class="who">Connecté(e) — <b id="agentName"></b> · Site : <span id="agentSite" class="mono"></span></div>
    <button onclick="logout()">Déconnexion</button>
  </div>
  <div class="screen" id="validate-screen" style="display:flex;">
    <h2 style="font-size:18px;margin-bottom:4px;">Contrôle d'entrée</h2>
    <p style="font-size:13px;color:#5a5f57;margin-top:2px;">Demandez au client son code de réservation et les 3 derniers chiffres de son téléphone.</p>

    <div class="field" style="margin-top:14px;">
      <label style="color:#5a5f57;">Code du billet</label>
      <input id="codeInput" type="text" placeholder="AC7F92" maxlength="8" style="width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-family:'Space Mono',monospace;font-size:18px;letter-spacing:2px;text-transform:uppercase;text-align:center;">
    </div>
    <div class="field" style="margin-top:10px;">
      <label style="color:#5a5f57;">3 derniers chiffres du téléphone</label>
      <input id="last3Input" type="text" maxlength="3" placeholder="•••" style="width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-family:'Space Mono',monospace;font-size:18px;letter-spacing:4px;text-align:center;">
    </div>
    <button class="btn-primary" style="max-width:none;margin-top:14px;" onclick="checkAndValidate()">Valider l'entrée</button>

    <div class="result-card" id="resultCard"></div>
    <div class="hint">Un seul contrôle suffit — le statut passe à « Utilisé » immédiatement si tout correspond.</div>
  </div>
</div>

<script>
/* La même URL /exec que GOOGLE_SHEETS_URL dans ton index.html — un seul et même Apps Script gère tout. */
const API_URL = 'https://script.google.com/macros/s/AKfycbytPAAXjSR2vTRHCS4T-msxxs4zikmr03I2vT0t5j6_8M-8pI7g-CONJq3W7qzSbaBQ/exec';

let session = JSON.parse(sessionStorage.getItem('ac_agent_session') || 'null');
let lastResult = null;

function showApp(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-container').style.display = 'flex';
  document.getElementById('agentName').textContent = session.nom;
  document.getElementById('agentSite').textContent = session.site;
}

if (session) showApp();

async function api(payload, attempt){
  attempt = attempt || 1;
  try{
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // évite le preflight CORS avec Apps Script
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } catch(e){
    // Apps Script peut être "endormi" après une inactivité : le premier appel
    // échoue ou traîne, on retente automatiquement 1 fois avant d'abandonner.
    if (attempt < 2){
      await new Promise(r => setTimeout(r, 1200));
      return api(payload, attempt + 1);
    }
    throw e;
  }
}

async function doLogin(){
  const agentId = document.getElementById('agentId').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginError');
  err.style.display = 'none';
  if (!agentId || !password) return;

  btn.disabled = true; btn.textContent = 'Connexion…';
  try{
    const r = await api({ type: 'agent-login', agentId, password });
    if (r.ok){
      session = { token: r.token, nom: r.nom, site: r.site };
      sessionStorage.setItem('ac_agent_session', JSON.stringify(session));
      showApp();
    } else {
      err.textContent = r.error || 'Connexion impossible';
      err.style.display = 'block';
    }
  } catch(e){
    err.textContent = 'Erreur réseau. Vérifiez votre connexion.';
    err.style.display = 'block';
  }
  btn.disabled = false; btn.textContent = 'Se connecter';
}

function logout(){
  sessionStorage.removeItem('ac_agent_session');
  session = null;
  document.getElementById('app-container').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

async function checkAndValidate(){
  const code = document.getElementById('codeInput').value.trim().toUpperCase();
  const last3 = document.getElementById('last3Input').value.trim();
  const card = document.getElementById('resultCard');
  if (!code) return;

  card.style.display = 'none';
  const btn = document.querySelector('#validate-screen .btn-primary');
  btn.disabled = true; btn.textContent = 'Vérification…';

  try{
    const r = await api({ type: 'agent-validate-mark', token: session.token, code, last3Check: last3 });

    if (!r.ok){
      card.className = 'result-card err';
      card.style.display = 'block';
      card.innerHTML = `<div class="status">✕ Refusé</div><h2>${r.error}</h2>`;
    } else {
      card.className = 'result-card ok';
      card.style.display = 'block';
      card.innerHTML = `
        <div class="status">🟢 Billet validé</div>
        <h2>${r.nom} — accès autorisé</h2>
        <div class="result-row"><span>Événement</span><b>${r.evenement}</b></div>
        <div class="result-row"><span>Billets</span><b>${r.quantite}</b></div>`;
      document.getElementById('codeInput').value = '';
      document.getElementById('last3Input').value = '';
    }
  } catch(e){
    card.className = 'result-card err';
    card.style.display = 'block';
    card.innerHTML = `<div class="status">✕ Erreur</div><h2>Connexion impossible, réessayez.</h2>`;
  }

  btn.disabled = false; btn.textContent = "Valider l'entrée";
  document.getElementById('codeInput').focus();
}

document.getElementById('codeInput')?.addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('last3Input').focus(); });
document.getElementById('last3Input')?.addEventListener('keydown', e => { if(e.key==='Enter') checkAndValidate(); });
document.getElementById('password')?.addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
</script>
</body>
</html>
