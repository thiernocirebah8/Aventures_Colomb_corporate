<style>
  :root{
    --navy:#0E3B50;
    --navy-dark:#0A2C3D;
    --teal:#2C7A8C;
    --orange:#F2884B;
    --yellow:#F5B93F;
    --green:#3E7A57;
    --cream:#FBF7EE;
    --cream-dark:#F0E9D8;
    --line:rgba(14,59,80,0.14);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;background:var(--cream);color-scheme:light;}
  body{
    background:var(--cream);
    color:var(--navy);
    font-family:'Inter',sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;letter-spacing:-0.01em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit;}
  img{max-width:100%;display:block;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  :focus-visible{outline:2.5px solid var(--teal);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}

  /* ---------- Layout shells ---------- */
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px;}
  header.site{
    position:sticky;top:0;z-index:40;
    background:rgba(251,247,238,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .header-inner{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;max-width:1180px;margin:0 auto;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand img{width:40px;height:40px;border-radius:9px;}
  .brand-text{display:flex;flex-direction:column;line-height:1.15;}
  .brand-text b{font-family:'Space Grotesk',sans-serif;font-size:15px;color:var(--navy);}
  .brand-text span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--teal);font-weight:600;}
  nav.top a, nav.top button{font-size:14px;font-weight:600;color:var(--navy);padding:8px 10px;border-radius:8px;}
  nav.top a:hover, nav.top button:hover{background:var(--cream-dark);}

  /* ---------- Hero ---------- */
  .hero{position:relative;padding:64px 24px 48px;overflow:hidden;background:#FFFFFF;border-bottom:1px solid var(--line);}
  .hero-inner{max-width:760px;margin:0 auto;text-align:center;}
  .eyebrow{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--orange);background:rgba(242,136,75,0.12);padding:6px 14px;border-radius:999px;margin-bottom:18px;}
  .hero h1{font-size:clamp(30px,5vw,48px);font-weight:700;color:var(--navy);margin-bottom:16px;}
  .hero h1 em{font-style:normal;color:var(--orange);}
  .hero p{font-size:16px;color:#3d5a68;max-width:520px;margin:0 auto 30px;}
  .hero-ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

  .btn{display:inline-flex;align-items:center;gap:8px;padding:13px 24px;border-radius:11px;font-weight:600;font-size:14.5px;transition:transform .15s ease, box-shadow .15s ease;}
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--orange);color:#fff;box-shadow:0 6px 16px rgba(242,136,75,0.35);}
  .btn-primary:hover{box-shadow:0 8px 20px rgba(242,136,75,0.45);}
  .btn-outline{background:transparent;border:1.5px solid var(--navy);color:var(--navy);}
  .btn-outline:hover{background:var(--navy);color:#fff;}
  .btn-teal{background:var(--teal);color:#fff;}
  .btn-teal:hover{filter:brightness(1.08);}
  .btn-ghost{color:var(--navy);text-decoration:underline;text-underline-offset:3px;}
  .btn-danger{background:#B84A3E;color:#fff;}
  .btn-sm{padding:8px 14px;font-size:13px;border-radius:8px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  /* road / route signature */
  .road{position:relative;height:36px;margin:12px auto 0;max-width:420px;}
  .road::before{
    content:"";position:absolute;top:50%;left:0;right:0;height:0;
    border-top:3px dashed var(--teal);opacity:.45;
  }
  .road .bus{position:absolute;top:50%;transform:translateY(-50%);font-size:22px;
    animation:drive 2.6s ease-in-out 1;left:0;}
  @keyframes drive{
    0%{left:0;transform:translateY(-50%) scaleX(1);}
    48%{left:calc(100% - 26px);transform:translateY(-50%) scaleX(1);}
    50%{left:calc(100% - 26px);transform:translateY(-50%) scaleX(-1);}
    100%{left:0;transform:translateY(-50%) scaleX(-1);}
  }

  /* ---------- Pourquoi nous choisir ---------- */
  section.why{padding:8px 24px 12px;}
  .why-grid{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;}
  .why-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 20px;text-align:left;transition:transform .18s ease, box-shadow .18s ease;}
  .why-card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(14,59,80,0.12);}
  .why-icon{font-size:60px;margin-bottom:10px;line-height:1;}
  .why-icon img{width:64px;height:64px;object-fit:cover;border-radius:14px;}
  .why-card b{font-family:'Space Grotesk',sans-serif;font-size:15.5px;display:block;margin-bottom:6px;}
  .why-card p{font-size:13px;color:#4d6875;margin-bottom:10px;}
  .why-more{font-size:12.5px;font-weight:600;color:var(--orange);}
  .testimonial-box{background:var(--cream-dark);border-left:3px solid var(--orange);border-radius:0 10px 10px 0;padding:14px 16px;margin-top:16px;font-size:13.5px;color:#3d5a68;font-style:italic;}
  .testimonial-box.empty{font-style:normal;color:#8098a3;}

  /* ---------- Category grid ---------- */
  section.categories{padding:8px 24px 64px;}
  .section-head{max-width:1180px;margin:0 auto 26px;display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .section-head h2{font-size:26px;color:var(--navy);}
  .section-head p{color:var(--teal);font-size:14px;font-weight:600;}
  .cat-grid{
    max-width:1180px;margin:0 auto;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;
    position:relative;
  }
  .cat-card{
    background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 18px;
    display:flex;flex-direction:column;gap:10px;text-align:left;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .cat-card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(14,59,80,0.12);border-color:transparent;}
  .cat-icon{width:104px;height:104px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:50px;overflow:hidden;line-height:1;}
  .cat-icon img{width:100%;height:100%;object-fit:cover;}
  .cat-card b{font-family:'Space Grotesk',sans-serif;font-size:16px;}
  .cat-card span.count{font-size:12.5px;color:#6b8391;font-weight:500;}

  /* ---------- Breadcrumb ---------- */
  .crumbs{max-width:1180px;margin:20px auto 0;padding:0 24px;display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--teal);font-weight:600;}
  .crumbs button{color:var(--teal);}
  .crumbs button:hover{text-decoration:underline;}
  .crumbs .sep{color:#B9C7CD;}
  .crumbs .current{color:var(--navy);}

  /* ---------- Lieu list (within category) ---------- */
  .lieu-grid{max-width:1180px;margin:24px auto 64px;padding:0 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;}
  .lieu-card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:transform .18s ease, box-shadow .18s ease;}
  .lieu-card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(14,59,80,0.12);}
  .lieu-card .thumb{height:150px;background:var(--cream-dark);position:relative;overflow:hidden;}
  .lieu-card .thumb img{width:100%;height:100%;object-fit:cover;}
  .lieu-card .price-tag{position:absolute;bottom:10px;right:10px;background:rgba(14,59,80,0.85);color:#fff;font-size:12.5px;padding:4px 10px;border-radius:999px;}
  .lire-plus{color:var(--orange, #C4432B);font-weight:600;cursor:pointer;white-space:nowrap;}
  .lire-plus:hover{text-decoration:underline;}
  .lost-ticket-box{background:var(--navy);color:#fff;border-radius:16px;padding:18px 20px;margin:0 0 18px;display:flex;flex-wrap:wrap;align-items:center;gap:14px;}
  .lost-ticket-box .ltb-icon{font-size:22px;}
  .lost-ticket-box .ltb-text{flex:1 1 220px;display:flex;flex-direction:column;}
  .lost-ticket-box .ltb-text b{font-size:15px;}
  .lost-ticket-box .ltb-text span{font-size:12.5px;color:#c3d2da;margin-top:2px;}
  .lost-ticket-box .ltb-form{display:flex;gap:8px;flex:1 1 320px;}
  .lost-ticket-box .ltb-form input{flex:1;padding:10px 12px;border-radius:10px;border:none;font-size:13.5px;}
  .lost-ticket-box .ltb-form .btn-outline{border-color:rgba(255,255,255,.4);color:#fff;white-space:nowrap;}
  .lost-ticket-box .ltb-status{flex-basis:100%;font-size:12.5px;color:#c3d2da;margin:6px 0 0;}
  .dl-tickets-list{display:flex;flex-direction:column;gap:12px;margin-top:16px;max-height:340px;overflow-y:auto;}
  .dl-ticket{border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;background:#fff;}
  .dl-ticket img{width:100%;height:90px;object-fit:cover;display:block;}
  .dl-ticket-body{padding:12px 14px;}
  .dl-ticket-event{font-size:13px;color:var(--navy);font-weight:600;margin-bottom:4px;}
  .dl-ticket-code{font-size:18px;color:var(--orange);font-weight:700;letter-spacing:2px;margin-bottom:8px;}
  .lieu-card .body{padding:16px 18px 18px;}
  .lieu-card .body b{font-family:'Space Grotesk',sans-serif;font-size:16px;display:block;margin-bottom:6px;}
  .lieu-card .body p{font-size:13.5px;color:#4d6875;margin-bottom:14px;min-height:38px;}

  /* ---------- Lieu detail ---------- */
  .lieu-detail{max-width:1000px;margin:20px auto 70px;padding:0 24px;}
  .gallery{border-radius:18px;overflow:hidden;background:var(--cream-dark);position:relative;}
  .gallery .main-photo{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--cream-dark);}
  .gallery .nav-arrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(14,59,80,0.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;}
  .gallery .nav-arrow:hover{background:rgba(14,59,80,0.8);}
  .gallery .nav-arrow.prev{left:14px;}
  .gallery .nav-arrow.next{right:14px;}
  .thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:4px;}
  .thumbs img{width:76px;height:56px;object-fit:cover;border-radius:9px;opacity:.55;flex-shrink:0;border:2px solid transparent;transition:opacity .15s, border-color .15s;}
  .thumbs img:hover{opacity:.85;}
  .thumbs img.active{opacity:1;border-color:var(--orange);}
  .lieu-info{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-top:26px;flex-wrap:wrap;}
  .lieu-info h1{font-size:26px;color:var(--navy);margin-bottom:8px;}
  .menu-btn{margin-bottom:14px;background:var(--orange);box-shadow:0 4px 12px rgba(242,136,75,0.35);}
  .lieu-info p{color:#3d5a68;max-width:560px;font-size:15px;}
  .map-links{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .price-box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 20px;text-align:right;min-width:180px;}
  .price-box .amount{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:600;color:var(--navy);}
  .price-box .unit{font-size:12px;color:#6b8391;margin-bottom:12px;}

  /* ---------- Modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(10,32,44,0.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;}
  .lightbox-overlay{background:rgba(6,20,28,0.92);padding:0;cursor:zoom-out;}
  .lightbox-img{max-width:96vw;max-height:96vh;object-fit:contain;border-radius:6px;touch-action:pinch-zoom;}
  .zoomable{cursor:zoom-in;}
  .search-box{max-width:520px;margin:0 auto 28px;position:relative;}
  .search-box input{width:100%;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;background:#fff;color:var(--navy);font-family:inherit;}
  .search-box input:focus{border-color:var(--teal);}
  #search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 30px rgba(14,59,80,0.15);max-height:340px;overflow-y:auto;z-index:20;}
  #search-results:empty{display:none;}
  .search-result{display:flex;align-items:center;gap:10px;padding:12px 16px;text-align:left;width:100%;border-bottom:1px solid var(--line);}
  .search-result:last-child{border-bottom:none;}
  .search-result:hover{background:var(--cream-dark);}
  .search-result .sr-icon{font-size:18px;}
  .search-result b{font-size:14px;color:var(--navy);}
  .search-result span{display:block;font-size:12px;color:#6b8391;}
  .search-empty{padding:16px;text-align:center;color:#7d939f;font-size:13.5px;}
  .modal{background:#fff;border-radius:18px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;padding:28px;position:relative;}
  .modal.wide{max-width:820px;}
  .modal h3{font-size:20px;color:var(--navy);margin-bottom:6px;}
  .modal .sub{font-size:13.5px;color:#6b8391;margin-bottom:20px;}
  .modal .close{position:absolute;top:16px;right:16px;font-size:20px;width:34px;height:34px;border-radius:50%;color:var(--navy);}
  .modal .close:hover{background:var(--cream-dark);}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--navy);margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:9px;font-family:inherit;font-size:16px;background:var(--cream);color:var(--navy);
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--teal);}
  .field textarea{resize:vertical;min-height:70px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:480px){.row2{grid-template-columns:1fr;}}

  .lieu-recap{background:var(--cream-dark);border-radius:12px;padding:14px 16px;margin-bottom:18px;}
  .lieu-recap .recap-row{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;}
  .lieu-recap .recap-row + .recap-row{margin-top:6px;}
  .lieu-recap .recap-total{border-top:1px dashed rgba(14,59,80,0.25);margin-top:10px;padding-top:10px;font-size:15px;}
  .lieu-recap .recap-total span{color:var(--orange);font-weight:700;}
  .lieu-recap .recap-discount{color:var(--green);font-size:12.5px;}
  .formula-note{font-size:12px;color:#6b8391;margin-top:10px;line-height:1.4;padding-top:10px;border-top:1px dashed var(--line);}

  .success-icon{width:56px;height:56px;border-radius:50%;background:rgba(62,122,87,0.15);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:16px;}
  .send-options{display:flex;flex-direction:column;gap:10px;margin-top:18px;}
  .send-options .btn{justify-content:center;}
  .notice{background:rgba(245,185,63,0.18);border:1px solid rgba(245,185,63,0.55);color:#7a5c14;font-size:12.5px;padding:10px 12px;border-radius:9px;margin-top:12px;}

  /* ---------- Admin ---------- */
  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:20px;}
  .tab{padding:9px 4px;font-size:13.5px;font-weight:600;color:#6b8391;border-bottom:2px solid transparent;margin-right:16px;}
  .tab.active{color:var(--navy);border-color:var(--orange);}
  .admin-lieu{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;}
  .admin-lieu .cat-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--teal);font-weight:700;margin-bottom:8px;}
  .photo-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;}
  .photo-row .ph{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;}
  .photo-row .ph img{width:100%;height:100%;object-fit:cover;}
  .photo-row .ph button{position:absolute;top:2px;right:2px;background:rgba(184,74,62,0.9);color:#fff;width:18px;height:18px;border-radius:50%;font-size:11px;line-height:1;}
  .upload-btn{border:1.5px dashed var(--teal);color:var(--teal);border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:600;display:inline-block;}
  .upload-btn:hover{background:rgba(44,122,140,0.08);}
  .booking-row{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:13.5px;}

/* ============================================================

   Dans Claude, utilise le stockage natif de l'environnement.

   alors automatiquement les données "partagées" (shared=true, celles du site)

const GOOGLE_SHEETS_URL = 'https://script.google.com/macros/s/AKfycbytPAAXjSR2vTRHCS4T-msxxs4zikmr03I2vT0t5j6_8M-8pI7g-CONJq3W7qzSbaBQ/exec';

/* ============================================================
   SUPABASE — billetterie (événements, catégories de billets, billets)
   La clé ci-dessous est la clé PUBLIQUE (anon/publishable) : elle ne donne
   accès qu'à la LECTURE des événements/catégories (politiques RLS), jamais
   aux billets eux-mêmes (emails/téléphones clients) ni à l'écriture. Toute
   écriture admin passe par admin-tickets.js, qui utilise la clé secrète
   côté serveur uniquement.
   ============================================================ */
const SUPABASE_URL = 'https://nkbwfnhxssbxrbiolyhv.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_nWrZ1LA8jeFF4PXNjtQbOg_RqUONkVD';
const ADMIN_TICKETS_URL = '/.netlify/functions/admin-tickets';
// Client Supabase Auth (clé publique uniquement) — sert à la connexion admin email + mot de passe.

async function loadEventsFromSupabase(){

      { headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } },
      8000
    );
    if(!res.ok) return [];
    const rows = await res.json();
    return rows.map(r => ({

    }));
  }catch(e){

  }

/* Précharge TOUT le contenu partagé en 1 seule requête réseau (au lieu d'une
   requête par information demandée). Essentiel sur connexion faible/instable :
   1 aller-retour lent vaut mieux que 7-8 allers-retours lents à la suite. */
let _prefetchPromise = null;
function prefetchAllConfig(){
  if(_prefetchPromise) return _prefetchPromise;
  _prefetchPromise = (async () => {
    try{
      const resp = await fetchWithTimeout(`${GOOGLE_SHEETS_URL}?action=getAll`, {}, 7000);
      if(resp.ok){
        const data = await resp.json();
        if(data.values){
          for(const k in data.values){ window.storage._mem['s:'+k] = data.values[k]; }
        }
      }
    }catch(e){ /* backend indisponible (ex: aperçu Claude) → chaque get() individuel prendra le relais */ }
  })();
  return _prefetchPromise;
}

if(!window.storage){
  window.storage = {
    _mem:{},
    async get(k,s){
      const key=(s?'s:':'p:')+k;
      if(s){
        await prefetchAllConfig();
        if(key in this._mem) return {key:k, value:this._mem[key], shared:true};
        // Clé absente du préchargement (ex: créée après coup) → on la demande individuellement.
        try{
          const resp = await fetchWithTimeout(`${GOOGLE_SHEETS_URL}?action=get&key=${encodeURIComponent(k)}`, {}, 6000);
          if(resp.ok){
            const data = await resp.json();
            if(data.found){ this._mem[key]=data.value; return {key:k, value:data.value, shared:true}; }
          }
        }catch(e){}
      }
      if(!(key in this._mem)) throw new Error('not found');
      return {key:k,value:this._mem[key],shared:!!s};
    },
    async set(k,v,s){
      const key=(s?'s:':'p:')+k;
      this._mem[key]=v;
      if(s){
        try{
          await fetchWithTimeout(GOOGLE_SHEETS_URL, {
            method:'POST', mode:'no-cors',
            headers:{'Content-Type':'text/plain;charset=utf-8'},
            body: JSON.stringify({type:'config-set', key:k, value:v})
          }, 6000);
        }catch(e){ /* pas grave, la copie locale reste dispo pour cette session */ }
      }
      return {key:k,value:v,shared:!!s};
    },
    async delete(k,s){
      const key=(s?'s:':'p:')+k;
      delete this._mem[key];
      if(s){
        try{
          await fetchWithTimeout(GOOGLE_SHEETS_URL, {
            method:'POST', mode:'no-cors',
            headers:{'Content-Type':'text/plain;charset=utf-8'},
            body: JSON.stringify({type:'config-delete', key:k})
          }, 6000);
        }catch(e){}
      }
      return {key:k,deleted:true,shared:!!s};
    },
    async list(p,s){ return {keys:[],shared:!!s}; }
  };
}
async function sGet(key){ try{ const r = await window.storage.get(key,true); return r ? JSON.parse(r.value) : null; }catch(e){ return null; } }
async function sSet(key,val){ try{ await window.storage.set(key, JSON.stringify(val), true); }catch(e){ console.error('storage set failed',e); } }

async function sendToGoogleSheets(payload){
  try{
    await fetchWithTimeout(GOOGLE_SHEETS_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},

    }, 6000);

  }
}

/* ============================================================
   SOLIDITÉ TECHNIQUE — file d'attente locale + retry automatique
   Si l'envoi vers Google Sheets échoue (connexion coupée, etc.),
   la donnée n'est pas perdue : elle est gardée dans le navigateur
   et renvoyée automatiquement dès que la connexion revient.
   ============================================================ */
function queueFailedSync(payload){
  try{
    const q = JSON.parse(localStorage.getItem('ac-sync-queue') || '[]');
    q.push({ payload, ts: Date.now() });
    localStorage.setItem('ac-sync-queue', JSON.stringify(q));
  }catch(e){ /* stockage indisponible, on ne peut rien faire de plus ici */ }
}
function markSyncSuccess(){
  try{ localStorage.setItem('ac-last-sync', new Date().toISOString()); }catch(e){}
}
function getSyncStatus(){
  let lastSync = null, queueLen = 0;
  try{ lastSync = localStorage.getItem('ac-last-sync'); }catch(e){}
  try{ queueLen = JSON.parse(localStorage.getItem('ac-sync-queue') || '[]').length; }catch(e){}
  return {
    lastSyncText: lastSync ? new Date(lastSync).toLocaleString('fr-FR') : 'Jamais',
    queueLen
  };
}
async function retrySyncQueue(){
  let q = [];
  try{ q = JSON.parse(localStorage.getItem('ac-sync-queue') || '[]'); }catch(e){ q = []; }
  if(!q.length) return;
  const remaining = [];
  for(const item of q){
    try{
      await fetchWithTimeout(GOOGLE_SHEETS_URL, {
        method:'POST', mode:'no-cors',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify(item.payload)
      }, 6000);
      markSyncSuccess();
    }catch(e){
      remaining.push(item);
    }
  }
  try{ localStorage.setItem('ac-sync-queue', JSON.stringify(remaining)); }catch(e){}
}

/* ------------------------------------------------------------
   SOLIDITÉ TECHNIQUE — sauvegarde locale IMMÉDIATE de la
   réservation/du billet lui-même, dès sa création en mémoire,
   AVANT tout appel réseau. Si le navigateur plante ou l'onglet
   se ferme juste après le clic "Envoyer" (ex: redirection vers
   le paiement), la demande n'est pas perdue : elle est reprise
   automatiquement au prochain chargement de la page.
   ------------------------------------------------------------ */
function backupPendingRecord(kind, record){
  try{
    const q = JSON.parse(localStorage.getItem('ac-pending-records') || '[]');
    q.push({ kind, record, ts: Date.now() });
    localStorage.setItem('ac-pending-records', JSON.stringify(q));
  }catch(e){ /* stockage indisponible, on ne peut rien faire de plus ici */ }
}
function clearPendingRecord(id){
  try{
    let q = JSON.parse(localStorage.getItem('ac-pending-records') || '[]');
    q = q.filter(item => item.record.id !== id);
    localStorage.setItem('ac-pending-records', JSON.stringify(q));
  }catch(e){}
}
async function recoverPendingRecords(){
  let q = [];
  try{ q = JSON.parse(localStorage.getItem('ac-pending-records') || '[]'); }catch(e){ q = []; }
  if(!q.length) return;
  for(const item of q){
    try{
      if(item.kind === 'booking'){
        const list = (await sGet('ac-bookings-v1')) || [];
        if(!list.some(b=>b.id===item.record.id)){
          list.unshift(item.record);
          await sSet('ac-bookings-v1', list);
        }
      }
      clearPendingRecord(item.record.id);
    }catch(e){ /* on retentera au prochain chargement */ }
  }
}
let emailjsReady = false;
function emailjsIsConfigured(){
  return !EMAILJS_PUBLIC_KEY.includes('REMPLACE') && !EMAILJS_SERVICE_ID.includes('REMPLACE') && !EMAILJS_TEMPLATE_ID.includes('REMPLACE');
}
function initEmailJS(){
  if(!emailjsIsConfigured() || typeof emailjs==='undefined') return;
  try{ emailjs.init({publicKey: EMAILJS_PUBLIC_KEY}); emailjsReady = true; }catch(e){ console.error('EmailJS init failed', e); }
}
/* Envoie l'email directement depuis le navigateur (aucune appli mail ne s'ouvre).
   clientEmail/clientName sont transmis en plus pour permettre à la fonction
   "Auto-Reply" d'EmailJS de répondre automatiquement au CLIENT (pas seulement à toi).
   Retourne true si envoyé avec succès, false sinon. */
async function sendEmailDirect(subject, message, toEmail, clientEmail, clientName){
  if(!emailjsIsConfigured() || !emailjsReady) return false;
  try{
    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
      subject: subject,
      message: message,
      to_email: toEmail || 'thiernocirebah8@gmail.com',
      client_email: clientEmail || '',
      client_name: clientName || ''
    });
    return true;
  }catch(e){
    console.error('EmailJS send failed', e);
    return false;
  }
}

/* ============================================================
   SOLIDITÉ TECHNIQUE — vérification d'intégrité au chargement
   Si les données partagées reviennent corrompues ou d'un type
   inattendu depuis Google Sheets (connexion coupée en plein
   milieu d'une sauvegarde, etc.), on revient automatiquement
   aux valeurs par défaut plutôt que d'afficher une page cassée.
   ============================================================ */
function isValidContent(c){
  return !!(c && Array.isArray(c.categories) && c.categories.length > 0 &&
    c.categories.every(cat => cat && typeof cat.id === 'string' && Array.isArray(cat.lieux)));
}
function isValidEventsList(e){
  return Array.isArray(e);
}

/* ============================================================
   SOLIDITÉ TECHNIQUE — validation stricte téléphone / email
   ============================================================ */
function isValidEmail(email){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((email||'').trim());
}
function isValidPhone(tel){
  const digits = (tel||'').replace(/[\s.-]/g,'');
  // Accepte +224XXXXXXXX / 224XXXXXXXX / 6XXXXXXXX (numéros guinéens usuels, 9 chiffres commençant par 6)
  return /^(\+?224)?6\d{8}$/.test(digits);
}
function validateContactFields(email, tel){

function getEventTiers(ev){
  if(ev.tiers && ev.tiers.length) return ev.tiers;

function eventRemaining(ev){

function formatStockLabel(remaining){

  if(remaining > 50) return 'Disponible';

function eventMinPrice(ev){

function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function renderEventDescription(desc, id){
  if(!desc) return '';
  const limit = 130;
  const clean = String(desc).trim();
  if(clean.length <= limit) return `<p>${escapeHtml(clean)}</p>`;
  const short = escapeHtml(clean.slice(0, limit).trim());
  const full = escapeHtml(clean);
  return `<p id="desc-${id}" data-short="${short}" data-full="${full}" data-expanded="0">${short}… <span class="lire-plus" onclick="toggleDesc('${id}', event)">Lire plus</span></p>`;
}
function toggleDesc(id, e){
  if(e) e.stopPropagation();
  const p = document.getElementById('desc-'+id);
  if(!p) return;
  if(p.dataset.expanded === '1'){
    p.innerHTML = p.dataset.short + '… <span class="lire-plus" onclick="toggleDesc(\''+id+'\', event)">Lire plus</span>';
    p.dataset.expanded = '0';
  } else {
    p.innerHTML = p.dataset.full + ' <span class="lire-plus" onclick="toggleDesc(\''+id+'\', event)">Réduire</span>';
    p.dataset.expanded = '1';
  }
}

/* Traite une liste d'éléments par petits groupes (au lieu de tout en même temps ou un par un) :
   plus robuste sur une connexion faible et évite de surcharger Google Apps Script. */
async function mapWithConcurrency(items, limit, asyncFn){
  const results = [];
  for(let i=0; i<items.length; i+=limit){
    const batch = items.slice(i, i+limit);
    const batchResults = await Promise.all(batch.map(asyncFn));
    results.push(...batchResults);
  }
  return results;
}
function normalizeForSearch(str){
  return (str||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function handleSearch(){
  const box = document.getElementById('search-results');
  const gridWrap = document.getElementById('cat-grid-wrap');
  const query = normalizeForSearch(document.getElementById('site-search').value.trim());
  if(!query){ box.innerHTML=''; if(gridWrap) gridWrap.style.display=''; return; }

  const results = [];
  content.categories.forEach(c=>{
    c.lieux.forEach(l=>{
      if(normalizeForSearch(l.name).includes(query) || normalizeForSearch(c.name).includes(query)){
        results.push({c,l});
      }
    });
  });

  if(gridWrap) gridWrap.style.display = 'none';
  if(!results.length){
    box.innerHTML = `<div class="search-empty">Aucun lieu ne correspond à "${document.getElementById('site-search').value}".</div>`;
    return;
  }
  box.innerHTML = results.slice(0,12).map(({c,l})=>`
    <button class="search-result" onclick="document.getElementById('site-search').value=''; document.getElementById('search-results').innerHTML=''; if(document.getElementById('cat-grid-wrap')) document.getElementById('cat-grid-wrap').style.display=''; openLieu('${c.id}','${l.id}')">
      <span class="sr-icon">${c.icon}</span>
      <span><b>${l.name}</b><span>${c.name} · ${fmt(l.price)}</span></span>
    </button>
  `).join('');
}

/* Empêche une requête de rester bloquée indéfiniment sur une connexion faible/instable :
   au bout de ce délai, on abandonne et on continue avec ce qu'on a déjà. */
async function fetchWithTimeout(url, options={}, timeoutMs=7000){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), timeoutMs);
  try{
    return await fetch(url, {...options, signal: controller.signal});
  } finally {
    clearTimeout(timer);
  }
}

/* ============================================================
   SEO DYNAMIQUE — met à jour le titre de l'onglet, la description et les
   données structurées (Schema.org) selon la vue affichée. Googlebot exécute
   le JavaScript, donc il voit ces informations (notamment les billets).

const SEO_BASE = 'https://aventurescolomb.com';
const SEO_DEFAULT_TITLE = "Sorties d'entreprise à Conakry | Aventures Colomb Corporate";
const SEO_DEFAULT_DESC = "Organisez sorties, excursions et team building pour votre équipe en Guinée : lieux, transport et activités clés en main. Billetterie d'événements en ligne.";
function seoClean(txt, max){
  const t = String(txt||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
  return t.length>max ? t.slice(0,max-1).trim()+'…' : t;
}
function seoSetJsonLd(data){
  let s = document.getElementById('ld-dynamic');
  if(!data){ if(s) s.remove(); return; }
  if(!s){ s = document.createElement('script'); s.type='application/ld+json'; s.id='ld-dynamic'; document.head.appendChild(s); }
  s.textContent = JSON.stringify(data);
}
function seoEventsLd(){
  const list = (events||[]).filter(e => e && e.name && e.date).map(e => {
    const offers = (e.tiers||[]).map(t => ({
      '@type':'Offer', name:t.name, price:Number(t.price)||0, priceCurrency:'GNF',
      availability: ((t.total||0)-(t.sold||0))>0 ? 'https://schema.org/InStock' : 'https://schema.org/SoldOut',
      url: SEO_BASE+'/?evenement='+encodeURIComponent(e.id)
    }));
    const ev = {
      '@type':'Event', name:e.name,
      startDate: e.date + (e.heure ? 'T'+e.heure : ''),
      eventStatus:'https://schema.org/EventScheduled',
      eventAttendanceMode:'https://schema.org/OfflineEventAttendanceMode',
      location:{ '@type':'Place', name:e.lieu||'Conakry',
        address:{ '@type':'PostalAddress', addressLocality:'Conakry', addressCountry:'GN' } },
      organizer:{ '@type':'Organization', name:'Aventures Colomb', url:SEO_BASE+'/' },
      url: SEO_BASE+'/?evenement='+encodeURIComponent(e.id)
    };
    if(e.description) ev.description = seoClean(e.description, 300);
    if(e.photo && /^https?:\/\//i.test(e.photo)) ev.image = [e.photo];
    if(offers.length) ev.offers = offers;
    return ev;
  });
  return list.length ? { '@context':'https://schema.org', '@graph':list } : null;
}

async function pollForTickets(tx, ref, attempt){
  attempt = attempt || 1;
  const statusEl = document.getElementById('poll-status');
  try{
    const res = await fetchWithTimeout(GET_TICKET_STATUS_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ transactionId: tx })
    }, 8000);
    const data = await res.json();
    if(data.ok && data.status === 'paye' && data.tickets && data.tickets.length){
      showDownloadableTickets(data.tickets, ref);
      return;
    }
  }catch(e){ /* on retente quand même */ }

  if(attempt < 8){
    if(statusEl) statusEl.textContent = 'Toujours en cours de confirmation… (' + attempt + '/8)';
    setTimeout(()=>pollForTickets(tx, ref, attempt+1), 3500);
  }else{
    if(statusEl) statusEl.innerHTML = 'Ça prend plus de temps que prévu. Ton code arrivera par email dès que le paiement sera confirmé — ou repasse ici avec ta référence <b>'+ref+'</b> via "Billet perdu" sur la page Billetterie.';
  }
}

// Dessine le billet sur un canvas (photo + code, même esprit que l'email)
// et déclenche le téléchargement en image PNG — s'enregistre directement
// dans les photos/téléchargements du téléphone.
function downloadTicketImage(idx, code, evenement, photoUrl, typeBillet){
  const W = 720, H = photoUrl ? 900 : 520;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  function drawRest(photoImg){
    ctx.fillStyle = '#FBF7EE'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#0E3B50'; ctx.fillRect(0,0,W,72);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 26px Arial'; ctx.textAlign = 'center';
    ctx.fillText('Aventures Colomb', W/2, 46);

    let y = 72;
    if(photoImg){
      const ph = 340;
      ctx.drawImage(photoImg, 0, y, W, ph);
      y += ph;
    }

    ctx.fillStyle = '#0E3B50'; ctx.fillRect(24, y+20, W-48, H-y-60);
    if(typeBillet){
      ctx.fillStyle = '#F2884B'; ctx.font = 'bold 14px Arial'; ctx.textAlign='center';
      ctx.fillText(typeBillet.toUpperCase(), W/2, y+48);
    }
    ctx.fillStyle = '#c3d2da'; ctx.font = '13px Arial'; ctx.textAlign='center';
    ctx.fillText("CODE D'ENTRÉE — À PRÉSENTER LE JOUR J", W/2, y+(typeBillet?76:60));
    ctx.fillStyle = '#F2884B'; ctx.font = 'bold 52px Courier New'; ctx.textAlign='center';
    ctx.fillText(code, W/2, y+(typeBillet?146:130));
    ctx.fillStyle = '#fff'; ctx.font = '18px Arial';
    ctx.fillText(evenement, W/2, y+(typeBillet?196:180));

    canvas.toBlob(function(blob){
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'billet-'+code+'.png';
      document.body.appendChild(link); link.click(); document.body.removeChild(link);
    });
  }

  if(photoUrl){
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = ()=>drawRest(img);
    img.onerror = ()=>drawRest(null); // image bloquée par CORS -> billet sans photo plutôt que rien
    img.src = photoUrl;
  } else {
    drawRest(null);
  }
}

async function shareLieu(catId, lieuId, e){
  if(e) e.stopPropagation();
  const l = findLieu(catId, lieuId);
  const url = `${window.location.origin}${window.location.pathname}?lieu=${catId}:${lieuId}`;
  const shareText = `${l?.name||'Un lieu'} — Aventures Colomb`;
  if(navigator.share){
    try{ await navigator.share({ title: shareText, text: shareText, url }); return; }
    catch(err){ return; }
  }
  try{
    await navigator.clipboard.writeText(url);
    showToast('🔗 Lien copié — colle-le où tu veux !');
  }catch(err){
    prompt('Copie ce lien pour le partager :', url);
  }
}

function showToast(msg){
  let t = document.getElementById('ac-toast');
  if(!t){
    t = document.createElement('div');
    t.id = 'ac-toast';
    t.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:999px;font-size:13.5px;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;transition:opacity .2s ease;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  requestAnimationFrame(()=>{ t.style.opacity='1'; });
  clearTimeout(t._hideTimer);
  t._hideTimer = setTimeout(()=>{ t.style.opacity='0'; }, 2600);
}

function onTierChange(tierId){
  selectedTierId = tierId;
  const ev = events.find(e=>e.id===pendingTicket);
  const tier = getEventTiers(ev).find(t=>t.id===tierId);
  const remaining = Math.max(0,(tier.total||0)-(tier.sold||0));
  const qtyInput = document.getElementById('ticket-qty');
  qtyInput.max = remaining;
  if(parseInt(qtyInput.value)>remaining) qtyInput.value = remaining;
  refreshTicketRecap();
}
function refreshTicketRecap(){
  const ev = events.find(e=>e.id===pendingTicket);
  const tier = getEventTiers(ev).find(t=>t.id===selectedTierId);
  const remaining = Math.max(0,(tier.total||0)-(tier.sold||0));
  const qtyInput = document.getElementById('ticket-qty');
  let qty = Math.max(1, parseInt(qtyInput.value) || 1);
  if(qty > remaining){ qty = remaining; qtyInput.value = remaining; }
  document.getElementById('ticket-tier-label').textContent = tier.name;
  document.getElementById('ticket-unit-price').textContent = fmt(tier.price);
  document.getElementById('ticket-total').textContent = fmt(tier.price * qty);
}
async function submitTicket(e){
  e.preventDefault();
  const fd = new FormData(e.target);

  const validationError = validateContactFields(fd.get('email'), fd.get('tel'));
  if(validationError){ alert(validationError); return; }

  const ev = events.find(ev=>ev.id===pendingTicket);
  const tiers = getEventTiers(ev);
  const tier = tiers.find(t=>t.id===selectedTierId) || tiers[0];
  const remaining = Math.max(0,(tier.total||0)-(tier.sold||0));
  let qty = Math.max(1, parseInt(fd.get('quantite'))||1);
  if(qty > remaining){ alert('Il ne reste que '+remaining+' billet(s) disponible(s) pour cette catégorie.'); return; }
  const total = tier.price * qty;
  const ref = await nextTicketRef();
  const transactionId = 'TK'+Date.now()+Math.floor(Math.random()*1000);

  // Le billet lui-même est créé de façon atomique côté Supabase, dans
  // init-ticket-payment (fonction purchase_ticket) — pas ici. On ne garde en
  // mémoire que l'objet local nécessaire à l'affichage pendant la redirection.
  const ticket = {
    id:'t'+Date.now(), ref, code:null, used:false, usedAt:null,
    eventId:ev.id, eventName:ev.name, eventDate:ev.date, eventHeure:ev.heure, typeBillet:tier.name,
    prenom:fd.get('prenom'), nom:fd.get('nom'), tel:fd.get('tel'), email:fd.get('email'),
    quantite:qty, prixUnitaire:tier.price, total,
    date:new Date().toISOString(), traite:false, transactionId, paiement:'En attente'
  };

  // Ouvre le guichet de paiement CinetPay (Orange Money et autres mobile money).
  // La réservation du billet (verrou anti-survente) se fait maintenant côté
  // Supabase, dans init-ticket-payment, AVANT même l'ouverture du paiement.
  document.getElementById('modal-root').innerHTML = `
    <div class="overlay"><div class="modal" style="text-align:center;">
      <div class="success-icon">⏳</div>
      <h3>Redirection vers le paiement…</h3>
      <p class="sub">Référence : <b class="mono">${ref}</b></p>
    </div></div>`;

  try{
    const initRes = await fetchWithTimeout(TICKET_PAYMENT_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        ref, transactionId, ticketId: ticket.id, tierId: tier.id, dateEnvoi: ticket.date, eventId: ev.id, site: ev.lieu || '',
        photo: ev.photo || '', evenement: ticket.eventName, typeBillet: tier.name, quantite: qty, total,
        prenom: ticket.prenom, nom: ticket.nom, tel: ticket.tel, email: ticket.email
      })
    }, 10000);
    const initData = await initRes.json();
    if(initData.ok && initData.paymentUrl){
      window.location.href = initData.paymentUrl;
      return;
    }
    alert('Le paiement n\'a pas pu démarrer : '+(initData.error||'erreur inconnue')+'. Réessaie ou contacte-nous sur WhatsApp.');
    closeModal();
    return;
  }catch(err){
    alert('Connexion au paiement impossible pour le moment. Vérifie ta connexion et réessaie.');
    closeModal();
    return;
  }

}

function calcTotal(unitPrice, participants, enteredCode, unit){
  const promo = promoConfig || {};
  const subtotal = unit==='forfait' ? unitPrice : unitPrice * participants;
  let discount = 0, discountLabel = '';
  if(promo.groupThreshold && promo.groupDiscount && participants >= promo.groupThreshold){
    discount = subtotal * (promo.groupDiscount/100);
    discountLabel = `Réduction groupe -${promo.groupDiscount}% (dès ${promo.groupThreshold} pers.)`;
  }
  if(enteredCode && promo.code && enteredCode.toUpperCase() === promo.code.toUpperCase()){
    const codeDiscount = promo.discountType==='percent' ? subtotal*((promo.discountValue||0)/100) : (promo.discountValue||0);
    if(codeDiscount > discount){ discount = codeDiscount; discountLabel = `Code promo "${promo.code}" appliqué`; }
  }
  if(enteredCode){
    const loyaltyHit = findLoyaltyCode(enteredCode.toUpperCase());
    if(loyaltyHit && !loyaltyHit.codeEntry.used){
      const pct = (loyaltyConfig && loyaltyConfig.discountPercent) || 0;
      const loyaltyDiscount = subtotal * (pct/100);
      if(loyaltyDiscount > discount){ discount = loyaltyDiscount; discountLabel = `Code fidélité "${enteredCode.toUpperCase()}" appliqué (-${pct}%)`; }
    }
  }
  discount = Math.min(discount, subtotal);
  return {subtotal, discount, discountLabel, total: Math.max(0, subtotal-discount)};
}

/* ============================================================
   PROGRAMME DE FIDÉLITÉ
   Compte les réservations par client (email ou téléphone) et
   génère automatiquement un code de réduction tous les X passages.
   ============================================================ */
function loyaltyKey(email, tel){
  const e = (email||'').trim().toLowerCase();
  if(e) return 'e:'+e;
  const t = (tel||'').replace(/\D/g,'');
  return t ? 'p:'+t : null;
}
function findLoyaltyCode(codeUpper){
  for(const key in loyaltyClients){
    const client = loyaltyClients[key];
    const codeEntry = (client.codes||[]).find(c => c.code.toUpperCase() === codeUpper);
    if(codeEntry) return {client, codeEntry};
  }
  return null;
}
async function redeemLoyaltyCodeIfMatched(enteredCode){
  const hit = findLoyaltyCode((enteredCode||'').toUpperCase());
  if(hit && !hit.codeEntry.used){
    hit.codeEntry.used = true;
    hit.codeEntry.usedAt = new Date().toISOString();
    await sSet('ac-loyalty-clients-v1', loyaltyClients);
  }
}
function generateLoyaltyCode(){
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let code = 'FID-';
  for(let i=0;i<5;i++){ code += chars[Math.floor(Math.random()*chars.length)]; }
  return code;
}
/* Enregistre une réservation confirmée pour un client, et génère un nouveau
   code fidélité si le seuil est atteint. Retourne le code généré (ou null). */
async function recordLoyalty({prenom, nom, email, tel}){
  const key = loyaltyKey(email, tel);
  if(!key) return null;
  if(!loyaltyClients[key]){
    loyaltyClients[key] = {prenom, nom, email, tel, count:0, codes:[]};
  }
  const client = loyaltyClients[key];
  client.prenom = prenom || client.prenom;
  client.nom = nom || client.nom;
  client.email = email || client.email;
  client.tel = tel || client.tel;
  client.count = (client.count||0) + 1;

  let newCode = null;
  const threshold = (loyaltyConfig && loyaltyConfig.threshold) || 0;
  if(threshold > 0 && client.count % threshold === 0){
    newCode = { code: generateLoyaltyCode(), createdAt: new Date().toISOString(), used:false };
    client.codes = client.codes || [];
    client.codes.push(newCode);
  }

  await sSet('ac-loyalty-clients-v1', loyaltyClients);

  if(newCode && client.email){
    const pct = (loyaltyConfig && loyaltyConfig.discountPercent) || 0;
    const subject = 'Votre code fidélité Aventures Colomb 🎁';
    const body = `Bonjour ${client.prenom||''},\n\nMerci pour votre fidélité ! Après ${client.count} réservation(s), vous débloquez un code de réduction :\n\nCode : ${newCode.code}\nAvantage : -${pct}% sur votre prochaine réservation\n\nSaisissez ce code dans le champ "Code promo" lors de votre prochaine réservation.\n\nÀ bientôt !\nAventures Colomb Corporate`;
    sendEmailDirect(subject, body, null, client.email, client.prenom).catch(()=>{});
  }

  return newCode;
}

async function checkDoubleBooking(lieuName, dateResa, heureResa){
  if(!dateResa || !heureResa) return false;
  try{
    const list = (await sGet('ac-bookings-v1')) || [];
    return list.some(b => b.lieuNom===lieuName && b.dateResa===dateResa && b.heureResa===heureResa);
  }catch(e){ return false; }
}

function resizeImageFile(file, maxWidth=1100, quality=0.82){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxWidth/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width*scale; canvas.height = img.height*scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ============================================================
   CLOUDINARY — stockage permanent des photos (hors Claude).
   Tant que ce n'est pas réellement hébergé (Netlify), la connexion externe
   est bloquée par la sécurité de l'environnement Claude : on retombe alors
   automatiquement sur le stockage local temporaire (resizeImageFile).
   ============================================================ */
const CLOUDINARY_CLOUD_NAME = 'wqdqhpro';
const CLOUDINARY_UPLOAD_PRESET = 'k6fi0rup';

async function uploadToCloudinary(file){
  try{
    const formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
    const resp = await fetchWithTimeout(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
      method: 'POST',
      body: formData
    }, 20000);
    if(!resp.ok) throw new Error('Cloudinary upload failed: '+resp.status);
    const data = await resp.json();
    return data.secure_url || null;
  }catch(e){
    console.warn('Cloudinary indisponible pour le moment, utilisation du stockage local de secours.', e);
    return null;
  }
}

/* Essaie Cloudinary (permanent) d'abord, retombe sur le stockage local (temporaire, Claude uniquement) si indisponible. */
async function uploadImageSmart(file, maxWidth=1100, quality=0.82){
  const cloudUrl = await uploadToCloudinary(file);
  if(cloudUrl) return cloudUrl;
  return await resizeImageFile(file, maxWidth, quality);
}

async function uploadMenuPdf(e, lieuId){
  const file = e.target.files[0];
  if(!file) return;
  if(file.size > 3*1024*1024){
    alert("Ce PDF est trop volumineux (max ~3 Mo). Essaie de le compresser avant de l'ajouter.");
    return;
  }
  const reader = new FileReader();
  reader.onload = async () => {
    const menu = await loadMenu(lieuId);
    menu.pdf = reader.result;
    menu.pdfName = file.name;
    await saveMenu(lieuId, menu);
    renderAdminDestinations();
  };
  reader.readAsDataURL(file);
}
async function removeMenuPdf(lieuId){
  const menu = await loadMenu(lieuId);
  menu.pdf = null;
  menu.pdfName = null;
  await saveMenu(lieuId, menu);
  renderAdminDestinations();
}

/* Récupération ponctuelle : retrouve les photos/menus uploadés avant le
   regroupement en classeurs uniques (anciennes clés une par lieu) et les
   fusionne dans le nouveau système. À utiliser une seule fois si besoin. */
async function migrateOldPerLieuData(){
  const btn = document.getElementById('migrate-btn');
  const msg = document.getElementById('migrate-msg');
  if(btn) btn.disabled = true;
  if(msg) msg.textContent = 'Recherche en cours...';

  const allLieux = [];
  content.categories.forEach(c => c.lieux.forEach(l => allLieux.push(l.id)));
  let foundCount = 0;

  for(const lieuId of allLieux){
    try{
      const oldPhotos = await sGet('ac-photos-'+lieuId);
      if(oldPhotos && oldPhotos.length){
        photosCache[lieuId] = oldPhotos;
        foundCount++;
      }
    }catch(e){}
    try{
      const oldMenu = await sGet('ac-menu-'+lieuId);
      if(oldMenu && ((oldMenu.photos&&oldMenu.photos.length) || oldMenu.pdf)){
        menuCache[lieuId] = oldMenu;
        foundCount++;
      }
    }catch(e){}
  }

  if(foundCount > 0){
    await Promise.all([
      sSet('ac-all-photos-v1', photosCache),
      sSet('ac-all-menus-v1', menuCache)
    ]);
    if(msg) msg.textContent = `✓ ${foundCount} élément(s) récupéré(s) et sauvegardé(s) dans le nouveau système.`;
    renderAdminDestinations();
  } else {
    if(msg) msg.textContent = 'Aucune ancienne photo ou menu retrouvé.';
  }
  if(btn) btn.disabled = false;
}

/* -- Billetterie tab (admin) -- */
async function callAdminTickets(action, params={}){
  try{
    // Le token expire (~1 h) : on prend la session à jour (Supabase la renouvelle seul).
    let token = window.adminToken;
    try{
      const { data: { session } } = await sb.auth.getSession();
      if(session && session.access_token){ token = session.access_token; window.adminToken = token; }
    }catch(e){}
    const res = await fetchWithTimeout(ADMIN_TICKETS_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json', 'Authorization': `Bearer ${token}`},
      body: JSON.stringify({ action, ...params })
    }, 12000);
    return await res.json();
  }catch(e){
    return { ok:false, error:'Connexion au serveur impossible pour le moment.' };
  }
}

async function checkEntryCode(){
  const input = document.getElementById('entry-code-input');
  const resultBox = document.getElementById('entry-code-result');
  const code = (input.value||'').trim().toUpperCase();
  if(!code){ resultBox.innerHTML = ''; return; }

  resultBox.innerHTML = `<span class="spin"></span>`;
  const result = await callAdminTickets('checkEntryCode', { code });

  if(!result.ok){
    resultBox.innerHTML = `<div class="notice" style="background:rgba(184,74,62,0.12);border-color:rgba(184,74,62,0.4);color:#8a2f24;">❌ ${result.error || 'Code invalide.'}</div>`;
    return;
  }
  const t = result.ticket;
  resultBox.innerHTML = `<div class="notice" style="background:rgba(62,122,87,0.15);border-color:rgba(62,122,87,0.4);color:var(--green);">✅ Billet valide — ${t.prenom} ${t.nom} · ${t.eventName} · ${t.quantite} billet(s)</div>`;

async function saveEvent(id){
  const ev = adminEvents.find(e=>e.id===id);
  ev.name = document.getElementById('ev-name-'+id).value.trim() || ev.name;
  ev.lieu = document.getElementById('ev-lieu-'+id).value.trim();
  ev.date = document.getElementById('ev-date-'+id).value;
  ev.heure = document.getElementById('ev-heure-'+id).value;
  ev.description = document.getElementById('ev-desc-'+id).value.trim();
  ev.partnerName = document.getElementById('ev-partner-name-'+id).value.trim();
  ev.partnerOrangeNumber = document.getElementById('ev-partner-number-'+id).value.trim();

  const tiers = getEventTiers(ev);
  ev.tiers = tiers.map(t=>{
    const nameEl = document.getElementById(`tier-name-${id}-${t.id}`);
    const priceEl = document.getElementById(`tier-price-${id}-${t.id}`);
    const totalEl = document.getElementById(`tier-total-${id}-${t.id}`);
    return {
      id: t.id,
      name: (nameEl?.value.trim()) || t.name,
      price: parseInt(priceEl?.value) || 0,
      total: parseInt(totalEl?.value) || 0,
      sold: t.sold || 0
    };
  });

  const box = document.getElementById('admin-event-'+id);
  const result = await callAdminTickets('updateEvent', {
    eventId: id, name: ev.name, lieu: ev.lieu, date: ev.date, heure: ev.heure, description: ev.description,
    partnerName: ev.partnerName, partnerOrangeNumber: ev.partnerOrangeNumber, partnerCommissionPercent: 0,
    tiers: ev.tiers.map(t=>({id:t.id, name:t.name, price:t.price, total:t.total}))
  });
  if(!result.ok){
    alert(result.error || "Erreur lors de l'enregistrement.");
    return;
  }
  if(box){
    const tag = document.createElement('div');
    tag.textContent = result.warning ? ('⚠️ '+result.warning) : '✓ Enregistré';
    tag.style.cssText = 'color:'+(result.warning?'var(--orange)':'var(--green)')+';font-size:12px;font-weight:600;margin-top:6px;';
    box.appendChild(tag);
    setTimeout(()=>tag.remove(), result.warning?4500:1800);
  }
  // Recharge depuis Supabase pour refléter l'état réel (ex: catégories qu'on
  // n'a pas pu supprimer parce que des billets ont déjà été vendus dessus).
  events = await loadEventsFromSupabase();
  renderAdminBilletterie();
}

      if(adminTab==='dashboard') renderAdminDashboard();
      if(adminTab==='destinations') renderAdminDestinations();
      if(adminTab==='billetterie') renderAdminBilletterie();
      if(adminTab==='reservations') renderAdminReservations();
      if(adminTab==='promotions') renderAdminPromotions();
      if(adminTab==='fidelite') renderAdminFidelite();
      if(adminTab==='parametres') renderAdminSettings();
    },0);
  }
};

/* Accès discret à l'espace admin : raccourci clavier Ctrl+Alt+A
   (les boutons visibles ont été retirés du menu et du pied de page) */
document.addEventListener('keydown', function(e){
  if(e.ctrlKey && e.altKey && (e.key==='a' || e.key==='A')){
    e.preventDefault();
    openAdminEntry();
  }
});

init();
</script>
